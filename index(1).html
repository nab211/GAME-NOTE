<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Note</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f5;color:#111}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.side{width:245px;background:#111;color:#fff;padding:24px 18px;position:fixed;inset:0 auto 0 0}
.logo{font-size:22px;font-weight:800;letter-spacing:-.7px;margin:2px 8px 34px}.logo span{color:#888}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:12px 13px;border-radius:10px}.nav button.active,.nav button:hover{background:#222;color:#fff}
.side-bottom{position:absolute;bottom:22px;left:18px;right:18px;color:#777;font-size:12px;line-height:1.5}
.main{margin-left:245px;width:calc(100% - 245px);padding:34px;max-width:1300px}
.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}.title{font-size:38px;letter-spacing:-1.8px;margin:5px 0 0;font-weight:800}
.btn{border:0;background:#111;color:#fff;padding:11px 16px;border-radius:10px;font-weight:700}.btn:hover{background:#292929}.btn.light{background:#fff;color:#111;border:1px solid #ddd}
.search{display:flex;margin-bottom:22px}.search input{width:100%;border:1px solid #ddd;background:#fff;border-radius:11px;padding:13px 15px;outline:0}.search input:focus{border-color:#999}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}.stat{background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:18px}.stat b{font-size:25px}.stat span{display:block;color:#777;font-size:12px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:19px;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px #0000000c}.game-head{display:flex;align-items:center;gap:13px}.icon{width:48px;height:48px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}.game-name{font-weight:800;font-size:17px}.muted{color:#777;font-size:12px}.progress{height:7px;background:#eee;border-radius:20px;overflow:hidden;margin:18px 0 8px}.bar{height:100%;background:#111;border-radius:20px}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.tag{background:#f0f0f0;padding:5px 8px;border-radius:7px;font-size:11px;color:#555}
.empty{padding:50px 20px;text-align:center;color:#777;background:#fff;border:1px dashed #d7d7d7;border-radius:16px;grid-column:1/-1}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px}.modal.show{display:grid}.box{background:#fff;width:min(500px,100%);border-radius:17px;padding:23px}.box h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px;outline:0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.note-list{display:grid;gap:12px;margin-top:15px}.note{background:#fff;border:1px solid #e5e5e5;border-radius:13px;padding:16px}.note b{display:block;margin-bottom:6px}.check{display:flex;gap:9px;align-items:center}.check input{accent-color:#111}
@media(max-width:850px){.side{width:70px;padding:20px 10px}.logo{font-size:0;text-align:center}.logo:after{content:"GN";font-size:18px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:20px}.side-bottom{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}.title{font-size:31px}}
@media(max-width:560px){.main{padding:17px}.grid,.stats{grid-template-columns:1fr}.top{align-items:start}.title{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="logo">GAME <span>NOTE</span></div>
<div class="nav">
<button class="active" onclick="showView('games',this)">Games</button>
<button onclick="showView('notes',this)">Notes</button>
<button onclick="showView('goals',this)">Goals</button>
</div>
<div class="side-bottom">Your games, notes and goals.<br>Saved locally in this browser.</div>
</aside>
<main class="main">
<div class="top"><div><div class="eyebrow">Personal game hub</div><div class="title" id="pageTitle">My Games</div></div><button class="btn" onclick="openGame()">+ Add game</button></div>
<div class="search"><input id="search" placeholder="Search games, notes..." oninput="render()"></div>
<div id="content"></div>
</main>
</div>
<div class="modal" id="gameModal"><div class="box">
<h2>Add a game</h2>
<div class="field"><label>GAME NAME</label><input id="gName" placeholder="Roblox"></div>
<div class="field"><label>SHORT TAG</label><input id="gTag" placeholder="RBX" maxlength="3"></div>
<div class="actions"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn" onclick="addGame()">Create</button></div>
</div></div>
<script>
const seed=[
{id:1,name:"Roblox",tag:"RBX",notes:[{t:"Sol's RNG",b:"Farm aura và theo dõi mốc thời gian."}],goals:["Đạt 30M aura","180,000 phút chơi"],progress:72},
{id:2,name:"FC Mobile",tag:"FC",notes:[{t:"Đội hình",b:"Ghi lại cầu thủ và chiến thuật."}],goals:["Hoàn thiện đội hình"],progress:45},
{id:3,name:"Minecraft",tag:"MC",notes:[{t:"Survival",b:"Ý tưởng base và các vật liệu cần farm."}],goals:["Xây base","Tìm Nether Fortress"],progress:30}];
let games=JSON.parse(localStorage.getItem("gameNoteData")||"null")||seed,view="games";
const save=()=>localStorage.setItem("gameNoteData",JSON.stringify(games));
function showView(v,el){view=v;document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));el.classList.add("active");document.getElementById("pageTitle").textContent=v==="games"?"My Games":v==="notes"?"All Notes":"Goals";render()}
function render(){let q=document.getElementById("search").value.toLowerCase(),list=games.filter(g=>(g.name+" "+g.tag+" "+g.notes.map(n=>n.t).join(" ")).toLowerCase().includes(q));if(view==="games")renderGames(list);else if(view==="notes")renderNotes(list);else renderGoals(list)}
function renderGames(list){let n=games.reduce((a,g)=>a+g.notes.length,0),goals=games.reduce((a,g)=>a+g.goals.length,0);document.getElementById("content").innerHTML=`<div class="stats"><div class="stat"><b>${games.length}</b><span>Games tracked</span></div><div class="stat"><b>${n}</b><span>Notes saved</span></div><div class="stat"><b>${goals}</b><span>Goals</span></div></div><div class="grid">${list.length?list.map(card).join(""):'<div class="empty">No games found.</div>'}</div>`}
function card(g){return `<div class="card"><div class="game-head"><div class="icon">${esc(g.tag)}</div><div><div class="game-name">${esc(g.name)}</div><div class="muted">${g.notes.length} notes · ${g.goals.length} goals</div></div></div><div class="progress"><div class="bar" style="width:${g.progress}%"></div></div><div class="muted">${g.progress}% progress</div><div class="card-foot"><span class="tag">${g.goals[0]?esc(g.goals[0]):"No goal yet"}</span><button class="btn light" onclick="viewGame(${g.id})">Open</button></div></div>`}
function viewGame(id){let g=games.find(x=>x.id===id);document.getElementById("pageTitle").textContent=g.name;document.getElementById("content").innerHTML=`<div class="stats"><div class="stat"><b>${g.progress}%</b><span>Progress</span></div><div class="stat"><b>${g.notes.length}</b><span>Notes</span></div><div class="stat"><b>${g.goals.length}</b><span>Goals</span></div></div><div class="card"><div class="game-head"><div class="icon">${esc(g.tag)}</div><div><div class="game-name">${esc(g.name)}</div><div class="muted">Game workspace</div></div></div><div class="progress"><div class="bar" style="width:${g.progress}%"></div></div><div class="field"><label>PROGRESS</label><input type="range" min="0" max="100" value="${g.progress}" oninput="setProgress(${g.id},this.value)"></div><h3>Goals</h3><div class="note-list">${g.goals.map(x=>`<div class="note"><label class="check"><input type="checkbox"> <span>${esc(x)}</span></label></div>`).join("")||'<div class="muted">No goals yet.</div>'}</div><h3>Notes</h3><div class="note-list">${g.notes.map(n=>`<div class="note"><b>${esc(n.t)}</b><span class="muted">${esc(n.b)}</span></div>`).join("")||'<div class="muted">No notes yet.</div>'}</div></div>`}
function setProgress(id,v){let g=games.find(x=>x.id===id);g.progress=+v;save();viewGame(id)}
function renderNotes(list){let notes=[];list.forEach(g=>g.notes.forEach(n=>notes.push({...n,game:g.name})));document.getElementById("content").innerHTML=`<div class="note-list">${notes.length?notes.map(n=>`<div class="note"><b>${esc(n.t)}</b><div class="muted">${esc(n.game)}</div><p>${esc(n.b)}</p></div>`).join(""):'<div class="empty">No notes yet.</div>'}</div>`}
function renderGoals(list){let goals=[];list.forEach(g=>g.goals.forEach(x=>goals.push({x,game:g.name})));document.getElementById("content").innerHTML=`<div class="note-list">${goals.length?goals.map(n=>`<div class="note"><label class="check"><input type="checkbox"> <span>${esc(n.x)}</span></label><div class="muted">${esc(n.game)}</div></div>`).join(""):'<div class="empty">No goals yet.</div>'}</div>`}
function openGame(){document.getElementById("gameModal").classList.add("show");document.getElementById("gName").focus()}
function closeModal(){document.getElementById("gameModal").classList.remove("show")}
function addGame(){let name=document.getElementById("gName").value.trim(),tag=(document.getElementById("gTag").value.trim()||name.slice(0,3)).toUpperCase();if(!name)return;games.push({id:Date.now(),name,tag,notes:[],goals:[],progress:0});save();closeModal();document.getElementById("gName").value="";document.getElementById("gTag").value="";render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
render();
</script>
</body>
</html>
